<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <link rel="stylesheet" href="./stytle/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <div class="hero">
            <h1>欢迎来到我的博客</h1>
            <p>记录交易成长，分享知识感悟</p>
        </div>

        <section class="category-section">
            <a href="./main/knowledge.html" class="category-card knowledge">
                <h2>知识分享</h2>
                <div class="category-icon">📚</div>
                <p>分享交易知识、技术分析、投资理念</p>
                <div class="category-posts">
                    <article class="post-card">
                        <time>2026-05-10</time>
                        <h3>缠论知识点总结</h3>
                        <p>走势必完美 · 市场是合力的结果</p>
                        <span class="tag">交易系统</span>
                    </article>
                </div>
            </a>

            <a href="./main/trading.html" class="category-card trading">
                <h2>交易记录</h2>
                <div class="category-icon">📈</div>
                <p>记录实盘交易、策略复盘、市场观察</p>
                <div class="category-posts">
                    <article class="post-card">
                        <time>即将更新</time>
                        <h3>交易日记</h3>
                        <p>定期记录交易心得与思考</p>
                        <span class="tag">实盘记录</span>
                    </article>
                </div>
            </a>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/load-components.js"></script>
</body>
</html>
